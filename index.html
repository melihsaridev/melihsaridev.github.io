<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melih Sarı | CS Student & Developer</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg: #090a0f;
            --card-bg: rgba(18, 20, 29, 0.65);
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(88, 166, 255, 0.4);
            --primary-glow: #58a6ff;
            --accent-purple: #bc8cff;
            --accent-green: #3fb950;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
            overflow-x: hidden;
            position: relative;
        }

        /* Animasyonlu Arka Plan Glow Hüzmeleri */
        .bg-glow-1, .bg-glow-2 {
            position: absolute;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.25;
            z-index: 0;
            animation: pulseGlow 8s ease-in-out infinite alternate;
        }

        .bg-glow-1 {
            top: 10%;
            left: 15%;
            background: var(--primary-glow);
        }

        .bg-glow-2 {
            bottom: 10%;
            right: 15%;
            background: var(--accent-purple);
            animation-delay: -4s;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1) translate(0, 0); opacity: 0.2; }
            100% { transform: scale(1.3) translate(20px, -20px); opacity: 0.35; }
        }

        /* Ana Kart / Container */
        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 580px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 44px 32px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7);
            text-align: center;
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Profil Fotoğrafı & Glow Ring */
        .profile-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 24px;
        }

        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.1);
            position: relative;
            z-index: 2;
        }

        .profile-glow {
            position: absolute;
            top: -4px;
            left: -4px;
            right: -4px;
            bottom: -4px;
            background: linear-gradient(135deg, var(--primary-glow), var(--accent-purple));
            border-radius: 50%;
            z-index: 1;
            filter: blur(10px);
            opacity: 0.6;
            animation: rotateGlow 6s linear infinite;
        }

        @keyframes rotateGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #ffffff 30%, #8b949e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Typewriter / Dinamik Metin */
        .typewriter-container {
            font-family: 'Fira Code', monospace;
            font-size: 0.95rem;
            color: var(--primary-glow);
            margin-bottom: 20px;
            min-height: 24px;
        }

        .cursor {
            display: inline-block;
            width: 8px;
            background-color: var(--primary-glow);
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        .bio {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 28px;
            font-weight: 400;
        }

        /* Tech Badges */
        .tech-stack {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 34px;
        }

        .badge {
            font-family: 'Fira Code', monospace;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 0.82rem;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .badge:hover {
            border-color: var(--primary-glow);
            background: rgba(88, 166, 255, 0.08);
            transform: translateY(-2px);
        }

        .badge i {
            color: var(--primary-glow);
        }

        /* Dinamik Bağlantılar */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link-card {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            padding: 18px 22px;
            border-radius: 16px;
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            overflow: hidden;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Hover Parlaması */
        .link-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.08), transparent);
            transition: left 0.5s ease;
        }

        .link-card:hover::before {
            left: 100%;
        }

        .link-card:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--border-hover);
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4), 0 0 15px rgba(88, 166, 255, 0.15);
        }

        .link-left {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 1rem;
            z-index: 2;
        }

        .link-left i {
            font-size: 1.3rem;
            width: 26px;
            text-align: center;
            transition: transform 0.3s ease, color 0.3s ease;
        }

        .link-card:hover .link-left i {
            color: var(--primary-glow);
            transform: scale(1.15);
        }

        .arrow-icon {
            color: var(--text-muted);
            font-size: 0.9rem;
            transition: transform 0.3s ease, color 0.3s ease;
            z-index: 2;
        }

        .link-card:hover .arrow-icon {
            color: var(--primary-glow);
            transform: translateX(6px);
        }

        footer {
            margin-top: 36px;
            font-size: 0.8rem;
            color: var(--text-muted);
            font-family: 'Fira Code', monospace;
        }
    </style>
</head>
<body>

    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <div class="container">
        
        <div class="profile-wrapper">
            <div class="profile-glow"></div>
            <img src="https://github.com/melihsaridev.png" alt="Melih Sarı" class="profile-img">
        </div>
        
        <h1>Melih Sarı</h1>
        
        <div class="typewriter-container">
            <span id="typewriter"></span><span class="cursor"></span>
        </div>
        
        <p class="bio">
            Exploring system-level concepts, software architecture,<br>and building clean solutions with C & Python.
        </p>

        <div class="tech-stack">
            <div class="badge"><i class="fa-solid fa-code"></i> C</div>
            <div class="badge"><i class="fa-brands fa-python"></i> Python</div>
            <div class="badge"><i class="fa-solid fa-microchip"></i> Algorithms</div>
            <div class="badge"><i class="fa-solid fa-layer-group"></i> Architecture</div>
        </div>

        <div class="links-container">
            
            <a href="https://github.com/melihsaridev" target="_blank" class="link-card">
                <div class="link-left">
                    <i class="fa-brands fa-github"></i>
                    <span>GitHub</span>
                </div>
                <i class="fa-solid fa-arrow-right arrow-icon"></i>
            </a>

            <a href="https://linkedin.com/in/melihsaridev" target="_blank" class="link-card">
                <div class="link-left">
                    <i class="fa-brands fa-linkedin"></i>
                    <span>LinkedIn</span>
                </div>
                <i class="fa-solid fa-arrow-right arrow-icon"></i>
            </a>

            <a href="https://x.com/melihsaridev" target="_blank" class="link-card">
                <div class="link-left">
                    <i class="fa-brands fa-x-twitter"></i>
                    <span>X (Twitter)</span>
                </div>
                <i class="fa-solid fa-arrow-right arrow-icon"></i>
            </a>

            <a href="https://reddit.com/user/melihsaridev" target="_blank" class="link-card">
                <div class="link-left">
                    <i class="fa-brands fa-reddit-alien"></i>
                    <span>Reddit</span>
                </div>
                <i class="fa-solid fa-arrow-right arrow-icon"></i>
            </a>

            <a href="mailto:melihsari.dev@gmail.com" class="link-card">
                <div class="link-left">
                    <i class="fa-regular fa-envelope"></i>
                    <span>Email Me</span>
                </div>
                <i class="fa-solid fa-arrow-right arrow-icon"></i>
            </a>

        </div>

        <footer>
            © 2026 melihsari.dev • All rights reserved.
        </footer>
    </div>

    <script>
        const words = ["CS Student & Developer", "C & Python Enthusiast", "System-Level Explorer", "Algorithms & Tech"];
        let i = 0;
        let timer;

        function typingEffect() {
            let word = words[i].split("");
            var loopTyping = function() {
                if (word.length > 0) {
                    document.getElementById('typewriter').innerHTML += word.shift();
                } else {
                    setTimeout(deletingEffect, 2000);
                    return false;
                }
                timer = setTimeout(loopTyping, 80);
            };
            loopTyping();
        }

        function deletingEffect() {
            let word = words[i].split("");
            var loopDeleting = function() {
                if (word.length > 0) {
                    word.pop();
                    document.getElementById('typewriter').innerHTML = word.join("");
                } else {
                    if (words.length > (i + 1)) {
                        i++;
                    } else {
                        i = 0;
                    }
                    setTimeout(typingEffect, 500);
                    return false;
                }
                timer = setTimeout(loopDeleting, 40);
            };
            loopDeleting();
        }

        typingEffect();
    </script>

</body>
</html>
