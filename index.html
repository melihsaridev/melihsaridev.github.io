<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melih Sarı | CS Student & Developer</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0d0f12;
            --card-bg: rgba(22, 27, 34, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-green: #2ea043;
            --accent-blue: #58a6ff;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(88, 166, 255, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(46, 160, 67, 0.05) 0%, transparent 40%);
        }

        .container {
            width: 100%;
            max-width: 680px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 2px solid var(--accent-blue);
            padding: 4px;
            margin-bottom: 20px;
            object-fit: cover;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .subtitle {
            font-family: 'Fira Code', monospace;
            color: var(--accent-blue);
            font-size: 0.95rem;
            margin-bottom: 16px;
        }

        .bio {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .tech-stack {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 32px;
        }

        .badge {
            font-family: 'Fira Code', monospace;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: var(--text-main);
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            padding: 16px 20px;
            border-radius: 12px;
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.25s ease;
        }

        .link-card:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--accent-blue);
            transform: translateY(-2px);
        }

        .link-left {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 1rem;
        }

        .link-left i {
            font-size: 1.2rem;
            width: 24px;
            text-align: center;
        }

        .arrow-icon {
            color: var(--text-muted);
            font-size: 0.85rem;
            transition: transform 0.25s ease;
        }

        .link-card:hover .arrow-icon {
            color: var(--accent-blue);
            transform: translateX(4px);
        }

        footer {
            margin-top: 32px;
            font-size: 0.8rem;
            color: var(--text-muted);
            font-family: 'Fira Code', monospace;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Profil İkonu / Resmi -->
        <img src="https://github.com/melihsaridev.png" alt="Melih Sarı" class="profile-img">
        
        <h1>Melih Sarı</h1>
        <div class="subtitle">CS Student & Developer</div>
        
        <p class="bio">
            Focused on algorithms, C, Python & software architecture.<br>
            Building clean solutions and explore system-level concepts.
        </p>

        <!-- Yetenek & Odak Rozetleri -->
        <div class="tech-stack">
            <span class="badge"><i class="fa-solid fa-code"></i> C</span>
            <span class="badge"><i class="fa-brands fa-python"></i> Python</span>
            <span class="badge"><i class="fa-solid fa-microchip"></i> Algorithms</span>
            <span class="badge"><i class="fa-solid fa-layer-group"></i> Architecture</span>
        </div>

        <!-- Bağlantılar -->
        <div class="links-container">
            
            <a href="https://github.com/melihsaridev" target="_blank" class="link-card">
                <div class="link-left">
                    <i class="fa-brands fa-github"></i>
                    <span>GitHub</span>
                </div>
                <i class="fa-solid fa-arrow-right arrow-icon"></i>
            </a>

            <a href="https://linkedin.com/in/melihsaridev" target="_blank" class="link-card">
                <div class="link-left">
                    <i class="fa-brands fa-linkedin"></i>
                    <span>LinkedIn</span>
                </div>
                <i class="fa-solid fa-arrow-right arrow-icon"></i>
            </a>

            <a href="https://x.com/melihsaridev" target="_blank" class="link-card">
                <div class="link-left">
                    <i class="fa-brands fa-x-twitter"></i>
                    <span>X (Twitter)</span>
                </div>
                <i class="fa-solid fa-arrow-right arrow-icon"></i>
            </a>

            <a href="https://reddit.com/user/melihsaridev" target="_blank" class="link-card">
                <div class="link-left">
                    <i class="fa-brands fa-reddit-alien"></i>
                    <span>Reddit</span>
                </div>
                <i class="fa-solid fa-arrow-right arrow-icon"></i>
            </a>

            <a href="mailto:melihsari.dev@gmail.com" class="link-card">
                <div class="link-left">
                    <i class="fa-regular fa-envelope"></i>
                    <span>Email Me</span>
                </div>
                <i class="fa-solid fa-arrow-right arrow-icon"></i>
            </a>

        </div>

        <footer>
            © 2026 melihsari.dev • All rights reserved.
        </footer>
    </div>

</body>
</html>
